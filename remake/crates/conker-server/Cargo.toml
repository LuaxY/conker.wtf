[package]
name = "conker-server"
version.workspace = true
edition.workspace = true

[dependencies]
conker-sim = { path = "../conker-sim", features = ["net"] }
# The match rules (Deathmatch), and the animation ids they play.
conker-rules = { path = "../conker-rules", features = ["net"] }
conker-anim = { path = "../conker-anim" }
# Server-side bots (the original's AI) and the level's lifts.
conker-bots = { path = "../conker-bots" }
# The asset pack (`conker-extract pack`): the scene's world, spawns, pickups and the bots' data.
conker-assets = { path = "../conker-assets" }
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "bevy_log", "bevy_state"] }
lightyear = { workspace = true, features = ["server", "netcode", "webtransport", "webtransport_self_signed", "websocket"] }
# The exact versions lightyear 0.30.1 uses; needed for the two-transport relink workaround.
lightyear_aeronet = "=0.30.1"
aeronet_io = "=0.21.0"
# The WebTransport server opened with a certificate that reloads (`tls`); the version lightyear uses.
aeronet_webtransport = "=0.21.0"
# lightyear's replication backend, for a per-component visibility filter (`Fighting` to its owner).
bevy_replicon = { version = "=0.44.3", default-features = false, features = ["server"] }
# SIGTERM (systemd's stop, the web app's kill) and SIGHUP exit as Ctrl-C does: the clients get the
# disconnect at once. Bevy's own Ctrl-C handler (bevy_app) already brings ctrlc; this only adds the feature.
ctrlc = { version = "3.4", features = ["termination"] }
